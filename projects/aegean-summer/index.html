
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aegean Summer — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ---------- BASE ---------- */

*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #ffffff;
    --ink: #0e0e0e;
    --accent: #e67d43;
    --pad: 48px;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
}

img {
    max-width: 100%;
}

/* ---------- NAVIGATION ---------- */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px var(--pad);
}

.n-logo {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    transition: color .2s ease;
}

.n-logo:hover {
    color: var(--accent);
}

.n-links {
    display: flex;
    gap: 40px;
}

.n-link {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: .45;
    transition: opacity .2s ease, color .2s ease;
}

.n-link:hover {
    opacity: 1;
    color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
    max-width: 1200px;
    margin: 120px auto 150px;
    padding: 0 var(--pad);
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 120px;
    align-items: end;
}

.project-heading {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.project-number {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .35);
    transition: color .3s ease;
}

.project-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(4rem, 9vw, 8rem);
    font-weight: 400;
    line-height: .95;
    letter-spacing: -.03em;
}

.project-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
    color: var(--accent);
}

.project-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    line-height: 2;
    color: rgba(0, 0, 0, .55);
}

.project-meta a {
    color: inherit;
    text-decoration: none;
    transition: color .2s ease;
}

.project-meta a:hover {
    color: var(--accent);
}

/* ---------- INTERACTIVE LOOKBOOK ---------- */

.lookbook {
    max-width: 1600px;
    margin: 0 auto 200px;
    padding: 0 var(--pad);
}

.lookbook-heading {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .45);
}

/* The book occupies the full available width */

.book-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

#book {
    width: 100%;
    margin: 0 auto;
}

/* Individual book pages */

#book .page {
    background: #f8f7f4;
    overflow: hidden;
}

#book .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

/* ---------- ORANGE NAVIGATION ARROWS ---------- */

.book-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 36px;
    margin-top: 30px;
}

.book-controls button {
    border: none;
    background: transparent;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    padding: 8px 14px;
    transition: opacity .2s ease, transform .2s ease;
}

.book-controls button:hover:not(:disabled) {
    opacity: .65;
    transform: translateX(2px);
}

#prev-page:hover:not(:disabled) {
    transform: translateX(-2px);
}

.book-controls button:disabled {
    opacity: .25;
    cursor: default;
}

.book-controls button:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 4px;
}

#page-counter {
    min-width: 110px;
    text-align: center;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .5);
}

.book-hint {
    text-align: center;
    margin-top: 18px;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .35);
}

/* ---------- CAMPAIGN IMAGE STORY ---------- */

.story {
    max-width: 1600px;
    margin: auto;
    padding: 0 var(--pad) 200px;
}

.frame {
    margin-bottom: 220px;
}

.frame img {
    width: 100%;
    display: block;
}

.wide {
    width: 72%;
    margin-left: 0;
}

.tall {
    width: 34%;
    margin-left: auto;
}

.medium {
    width: 48%;
    margin-left: 12%;
}

.small {
    width: 28%;
    margin-left: 58%;
}

.large {
    width: 66%;
    margin-left: auto;
    margin-right: auto;
}

.caption {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .45);
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 900px) {
    :root {
        --pad: 24px;
    }

    .n-links {
        gap: 18px;
    }

    .n-link,
    .n-logo {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .project-intro {
        grid-template-columns: 1fr;
        gap: 40px;
        margin: 80px auto 100px;
    }

    .project-title {
        font-size: 58px;
    }

    .lookbook {
        margin-bottom: 100px;
    }

    .lookbook-heading {
        margin-bottom: 16px;
    }

    .book-controls {
        gap: 24px;
        margin-top: 20px;
    }

    .book-controls button {
        font-size: 24px;
    }

    .book-hint {
        font-size: 8px;
    }

    .frame {
        margin-bottom: 80px;
    }

    .wide,
    .medium,
    .tall,
    .small,
    .large {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
    }
}

@media (max-width: 480px) {
    nav {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .n-links {
        gap: 12px;
    }

    .n-link,
    .n-logo {
        font-size: 8px;
        letter-spacing: .08em;
    }

    .project-title {
        font-size: 52px;
    }

    .project-meta {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- ---------- NAVIGATION ---------- -->

<nav>
    <a href="https://mayaterzi.com" class="n-logo">Maya Terzi</a>

    <div class="n-links">
        <a href="https://mayaterzi.com/projects" class="n-link">Projects</a>
        <a href="https://mayaterzi.com/maya" class="n-link">About</a>
        <a href="https://mayaterzi.com/connect" class="n-link">Connect</a>
    </div>
</nav>

<!-- ---------- PROJECT INTRO ---------- -->

<section class="project-intro">

    <div class="project-heading">
        <div class="project-number">01</div>

        <h1 class="project-title">
            <a href="#">Aegean<br>Summer</a>
        </h1>
    </div>

    <div class="project-meta">
        Photo Direction<br>
        Graphic Design<br>
        Typography<br>

        <a href="https://instagram.com/byterzievi"
           target="_blank"
           rel="noopener noreferrer">
            View Social Channel
        </a>

        <br><br>

        Fall 2026
    </div>

</section>

<!-- ---------- INTERACTIVE FLIPBOOK ---------- -->

<section class="lookbook">

    <div class="lookbook-heading">
        <span>The Campaign</span>
        <span>01 — 27</span>
    </div>

    <div class="book-container">
        <div id="book"></div>
    </div>

    <div class="book-controls">

        <button
            id="prev-page"
            type="button"
            aria-label="Previous page"
            disabled>
            ←
        </button>

        <span id="page-counter" aria-live="polite">COVER</span>

        <button
            id="next-page"
            type="button"
            aria-label="Next page">
            →
        </button>

    </div>

    <p class="book-hint">Click or drag to turn the page</p>

</section>

<!-- ---------- FULL CAMPAIGN PHOTOS ---------- -->

<section class="story">

    <div class="frame wide">
        <img src="1.png" alt="Aegean Summer campaign photograph 1">
        <div class="caption">Final Campaign</div>
    </div>

    <div class="frame tall">
        <img src="2.png" alt="Aegean Summer campaign photograph 2">
        <div class="caption">Final Campaign</div>
    </div>

    <div class="frame medium">
        <img src="3.png" alt="Aegean Summer campaign photograph 3">
        <div class="caption">Final Campaign</div>
    </div>

</section>

<!-- ---------- PAGE FLIP LIBRARY ---------- -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const bookElement = document.getElementById("book");
    const previousButton = document.getElementById("prev-page");
    const nextButton = document.getElementById("next-page");
    const counter = document.getElementById("page-counter");

    // Front cover + interior images + back cover.
    // All image paths are relative to this HTML file.

    const images = [
        "cover-front.png",
        ...Array.from({ length: 26 }, (_, i) => `${i + 1}.png`),
        "cover-back.png"
    ];

    // Create the individual pages.

    const pages = images.map((src, index) => {

        const page = document.createElement("div");
        page.className = "page";

        const img = document.createElement("img");
        img.src = src;
        img.alt =
            index === 0
                ? "Aegean Summer front cover"
                : index === images.length - 1
                    ? "Aegean Summer back cover"
                    : `Aegean Summer campaign page ${index}`;

        img.draggable = false;

        page.appendChild(img);

        return page;
    });

    // Set up the animated book.

    if (typeof St === "undefined" || !St.PageFlip) {
        counter.textContent = "BOOK UNAVAILABLE";
        nextButton.disabled = true;

        console.error(
            "The page-flip library did not load. Check your internet connection."
        );

        return;
    }

    const pageFlip = new St.PageFlip(bookElement, {

        // Dimensions of one page, not the entire open spread.
        width: 550,
        height: 750,

        size: "stretch",
        minWidth: 280,
        maxWidth: 600,
        minHeight: 380,
        maxHeight: 800,

        showCover: true,
        usePortrait: true,
        startPage: 0,

        flippingTime: 800,
        drawShadow: true,
        maxShadowOpacity: 0.18,

        mobileScrollSupport: false,
        clickEventForward: true,
        useMouseEvents: true,
        autoSize: true

    });

    pageFlip.loadFromHTML(pages);

    // Update arrows and page counter after each turn.

    function updateControls() {

        const current = pageFlip.getCurrentPageIndex();
        const last = images.length - 1;

        previousButton.disabled = current === 0;
        nextButton.disabled = current >= last;

        if (current === 0) {
            counter.textContent = "COVER";
        } else if (current === last) {
            counter.textContent = "BACK COVER";
        } else {
            const first = current;
            const second = Math.min(current + 1, last);

            counter.textContent =
                String(first).padStart(2, "0") +
                " — " +
                String(second).padStart(2, "0");
        }
    }

    previousButton.addEventListener("click", function () {
        pageFlip.flipPrev();
    });

    nextButton.addEventListener("click", function () {
        pageFlip.flipNext();
    });

    pageFlip.on("flip", updateControls);

    updateControls();

    // Keyboard navigation while interacting with the book.
    // Do not intercept arrow keys while typing in form fields.

    document.addEventListener("keydown", function (event) {

        const tag = event.target.tagName;

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT" ||
            event.target.isContentEditable
        ) {
            return;
        }

        const rect = bookElement.getBoundingClientRect();

        if (
            rect.width === 0 ||
            rect.height === 0 ||
            rect.bottom < 0 ||
            rect.top > window.innerHeight
        ) {
            return;
        }

        if (event.key === "ArrowRight") {
            pageFlip.flipNext();
        }

        if (event.key === "ArrowLeft") {
            pageFlip.flipPrev();
        }
    });

});
</script>

</body>
</html>
