<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aegean Summer — Maya Terzi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--white:#fff;
--ink:#0e0e0e;
--accent:#e67d43;
--pad:48px;
}

body{
background:#fff;
color:var(--ink);
font-family:'Inter',sans-serif;
font-weight:300;
}


/* ---------- BOOK CONTROLS ---------- */

.book-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 36px;
    margin-top: 30px;
}

.book-controls button {
    border: none;
    background: transparent;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    padding: 8px 14px;
    transition: opacity .2s ease, transform .2s ease;
}

.book-controls button:hover:not(:disabled) {
    opacity: .65;
    transform: translateX(2px);
}

#prev-page:hover:not(:disabled) {
    transform: translateX(-2px);
}

.book-controls button:disabled {
    opacity: .25;
    cursor: default;
}

#page-counter {
    min-width: 100px;
    text-align: center;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, .5);
}
    
/* ---------- NAV ---------- */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:24px var(--pad);
}

.n-logo{
font-size:11px;
letter-spacing:.18em;
text-transform:uppercase;
font-weight:500;
color:var(--ink);
text-decoration:none;
transition:.2s;
}

.n-logo:hover{
color:var(--accent);
}

.n-links{
display:flex;
gap:40px;
}

.n-link{
font-size:11px;
letter-spacing:.18em;
text-transform:uppercase;
text-decoration:none;
color:var(--ink);
opacity:.45;
transition:.2s;
}

.n-link:hover{
opacity:1;
color:var(--accent);
}

/* ---------- INTRO ---------- */

.project-intro{
    max-width:1200px;
    margin:120px auto 220px;
    padding:0 var(--pad);
    display:grid;
    grid-template-columns:1fr 320px;
    gap:120px;
    align-items:end;
}

.project-heading{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.project-number{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:rgba(0,0,0,.35);
    transition:.3s;
}

.project-title{
    font-family:'EB Garamond',serif;
    font-size:clamp(4rem,9vw,8rem);
    font-weight:400;
    line-height:.95;
    letter-spacing:-.03em;
}

.project-title a{
    color:var(--ink);
    text-decoration:none;
    transition:color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number{
    color:var(--accent);
}

.project-meta{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.18em;
    line-height:2;
    color:rgba(0,0,0,.55);
}

<!-- ---------- AEGEAN SUMMER FLIPBOOK ---------- -->

<section class="lookbook">

.book-controls button {

.book-controls button:hover:not(:disabled) {

.book-controls button:disabled {

<!-- ---------- PAGE FLIP LIBRARY ---------- -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const bookElement = document.getElementById("book");

    const pageFlip = new St.PageFlip(bookElement, {
        width: 550,
        height: 750,

        size: "stretch",
        minWidth: 280,
        maxWidth: 1200,
        minHeight: 380,
        maxHeight: 800,

        showCover: true,
        usePortrait: true,
        drawShadow: true,
        flippingTime: 800,

        maxShadowOpacity: 0.18,
        mobileScrollSupport: false,
        clickEventForward: true,
        useMouseEvents: true,
        startPage: 0,
        autoSize: true
    });

    /*
       Replace these filenames with your actual image paths.
       Order: front cover, interior pages, back cover.
    */

    const images = [
        "cover-front.png",

        ...Array.from(
            { length: 25 },
            (_, i) => `image${i + 1}.png`
        ),

        "cover-back.png"
    ];

    const pages = images.map((src, index) => {
        const page = document.createElement("div");

        page.className = "page";

        const img = document.createElement("img");
        img.src = src;
        img.alt = index === 0
            ? "Aegean Summer front cover"
            : index === images.length - 1
                ? "Aegean Summer back cover"
                : `Aegean Summer campaign page ${index}`;

        img.draggable = false;

        page.appendChild(img);

        return page;
    });

    pageFlip.loadFromHTML(pages);

    const previousButton = document.getElementById("prev-page");
    const nextButton = document.getElementById("next-page");
    const counter = document.getElementById("page-counter");

    function updateControls() {
        const current = pageFlip.getCurrentPageIndex();
        const total = images.length;

        previousButton.disabled = current === 0;
        nextButton.disabled = current >= total - 1;

        if (current === 0) {
            counter.textContent = "COVER";
        } else if (current === total - 1) {
            counter.textContent = "BACK COVER";
        } else {
            const first = current;
            const second = Math.min(current + 1, total - 1);

            counter.textContent =
                `${String(first).padStart(2, "0")} — ` +
                `${String(second).padStart(2, "0")}`;
        }
    }

    previousButton.addEventListener("click", () => {
        pageFlip.flipPrev();
    });

    nextButton.addEventListener("click", () => {
        pageFlip.flipNext();
    });

    pageFlip.on("flip", updateControls);

    updateControls();

});
</script>
