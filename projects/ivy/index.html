
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Black Ivy — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #fff;
    --ink: #0e0e0e;
    --accent: #e67d43;
    --pad: 48px;
}

body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
}

/* ---------- NAV ---------- */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px var(--pad);
}

.n-logo {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    transition: .2s;
}

.n-logo:hover {
    color: var(--accent);
}

.n-links {
    display: flex;
    gap: 40px;
}

.n-link {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: .45;
    transition: .2s;
}

.n-link:hover {
    opacity: 1;
    color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
    max-width: 1400px;
    margin: 120px auto 150px;
    padding: 0 var(--pad);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 100px;
    align-items: end;
}

.project-heading {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.project-number {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(0,0,0,.35);
    transition: .3s;
}

.project-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(4rem, 9vw, 8rem);
    font-weight: 400;
    line-height: .9;
    letter-spacing: -.03em;
}

.project-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
    color: var(--accent);
}

.project-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    line-height: 2;
    color: rgba(0,0,0,.55);
}

/* ---------- IMAGE STORY ---------- */

.story {
    max-width: 1600px;
    margin: auto;
    padding: 0 var(--pad) 180px;
}

/* Two-column image layout */

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 28px;
    row-gap: 110px;
    align-items: start;
}

/* Image frames */

.frame {
    width: 100%;
    overflow: hidden;
}

.frame img {
    width: 100%;
    display: block;
    object-fit: cover;
    transition: transform .7s ease;
}

.frame:hover img {
    transform: scale(1.015);
}

/* Consistent portrait image proportions */

.frame.pair img {
    aspect-ratio: 4 / 5;
    object-fit: cover;
}

/* Final centered image */

.frame.center {
    grid-column: 1 / -1;
    width: 66%;
    justify-self: center;
}

.frame.center img {
    width: 100%;
    height: auto;
}

/* Captions */

.caption {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.45);
}

/* ---------- VIDEO BREAK ---------- */

.video-section {
    width: 82%;
    margin: 140px auto;
}

.video-frame {
    width: 100%;
    overflow: hidden;
    background: #f2f2f2;
}

.video-frame video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
}

.video-caption {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.45);
}

/* ---------- TABLET ---------- */

@media (max-width: 900px) {

    :root {
        --pad: 28px;
    }

    .project-intro {
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 40px;
        margin: 90px auto 120px;
    }

    .project-title {
        font-size: clamp(4rem, 10vw, 6rem);
    }

    .gallery-grid {
        column-gap: 20px;
        row-gap: 75px;
    }

    .video-section {
        width: 90%;
        margin: 100px auto;
    }

    .frame.center {
        width: 75%;
    }
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

    :root {
        --pad: 20px;
    }

    nav {
        padding: 22px var(--pad);
    }

    .n-links {
        gap: 16px;
    }

    .n-logo,
    .n-link {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .project-intro {
        grid-template-columns: 1fr;
        gap: 32px;
        margin: 75px auto 85px;
    }

    .project-title {
        font-size: 64px;
    }

    .project-meta {
        font-size: 10px;
        line-height: 2;
    }

    .story {
        padding: 0 var(--pad) 100px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
        row-gap: 55px;
    }

    .frame.pair img {
        aspect-ratio: auto;
        height: auto;
    }

    .frame.center {
        grid-column: auto;
        width: 100%;
    }

    .video-section {
        width: 100%;
        margin: 75px auto;
    }

    .video-frame video {
        aspect-ratio: 16 / 9;
    }

    .caption,
    .video-caption {
        font-size: 9px;
        margin-top: 12px;
    }
}

</style>
</head>

<body>

<nav>

    <a href="https://mayaterzi.com" class="n-logo">Maya Terzi</a>

    <div class="n-links">
        <a href="https://mayaterzi.com/projects" class="n-link">Projects</a>
        <a href="https://mayaterzi.com/maya" class="n-link">About</a>
        <a href="https://mayaterzi.com/connect" class="n-link">Connect</a>
    </div>

</nav>


<!-- PROJECT INTRO -->

<section class="project-intro">

    <div class="project-heading">

        <div class="project-number">12</div>

        <h1 class="project-title">
            <a href="#">
                Black<br>Ivy
            </a>
        </h1>

    </div>

    <div class="project-meta">

        Fashion Design<br>
        Creative Direction<br>
        Show Operations

        <br><br>

        Spring 2024

    </div>

</section>

<!-- IMAGE STORY -->

<section class="story">

    <div class="gallery-grid">

        <div class="frame pair">
            <img src="image1.png" alt="Black Ivy Look 01">
            <div class="caption">Look 01</div>
        </div>

        <div class="frame pair">
            <img src="image2.png" alt="Black Ivy Look 02">
            <div class="caption">Look 02</div>
        </div>

        <div class="frame pair">
            <img src="image3.png" alt="Black Ivy Looks 03 and 04">
            <div class="caption">Look 03 + 04</div>
        </div>

        <div class="frame pair">
            <img src="image4.png" alt="Black Ivy Look 05">
            <div class="caption">Look 05</div>
        </div>

        <div class="frame center">
            <img src="image5.png" alt="Black Ivy Looks 06 and 07">
            <div class="caption">Look 06 + 07</div>
        </div>

    </div>

</section>

</body>
</html>
