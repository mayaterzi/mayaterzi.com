<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morning on the Caspian — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--white:#fff;
--ink:#0e0e0e;
--accent:#e67d43;
--pad:48px;
}

body{
background:#fff;
color:var(--ink);
font-family:'Inter',sans-serif;
font-weight:300;
}

/* ---------- NAV ---------- */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:24px var(--pad);
}

.n-logo{
font-size:11px;
letter-spacing:.18em;
text-transform:uppercase;
font-weight:500;
color:var(--ink);
text-decoration:none;
transition:.2s;
}

.n-logo:hover{
color:var(--accent);
}

.n-links{
display:flex;
gap:40px;
}

.n-link{
font-size:11px;
letter-spacing:.18em;
text-transform:uppercase;
text-decoration:none;
color:var(--ink);
opacity:.45;
transition:.2s;
}

.n-link:hover{
opacity:1;
color:var(--accent);
}

/* ---------- INTRO ---------- */

.project-intro{
    max-width:1200px;
    margin:120px auto 220px;
    padding:0 var(--pad);
    display:grid;
    grid-template-columns:1fr 320px;
    gap:120px;
    align-items:end;
}

.project-heading{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.project-number{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:rgba(0,0,0,.35);
    transition:.3s;
}

.project-title{
    font-family:'EB Garamond',serif;
    font-size:clamp(4rem,9vw,8rem);
    font-weight:400;
    line-height:.95;
    letter-spacing:-.03em;
}

.project-title a{
    color:var(--ink);
    text-decoration:none;
    transition:color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number{
    color:var(--accent);
}

.project-meta{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.18em;
    line-height:2;
    color:rgba(0,0,0,.55);
}


/* ---------- EDITORIAL IMAGE GRID ---------- */

.story {
  max-width: 1600px;
  margin: auto;
  padding: 0 var(--pad) 180px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 32px;
  row-gap: 85px;
  align-items: start;
}

.frame {
  width: 100%;
  min-width: 0;
  margin: 0;
  overflow: hidden;
}

.frame img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform .7s ease, filter .5s ease;
}

.frame:hover img {
  transform: scale(1.015);
  filter: brightness(.95);
}

/* Center image spans both columns */

.frame.center {
  grid-column: 1 / -1;
  width: 66%;
  justify-self: center;
}

/* Matching proportions for paired images */

.frame.pair img {
  aspect-ratio: 4 / 5;
  object-fit: cover;
}

/* Captions */

.caption {
  margin-top: 16px;
  font-size: 10px;
  letter-spacing: .16em;
  line-height: 1.8;
  text-transform: uppercase;
  color: rgba(0,0,0,.45);
  transition: color .3s ease;
}

.frame:hover .caption {
  color: var(--accent);
}

/* ---------- TABLET ---------- */

@media(max-width:900px) {

  :root {
    --pad: 24px;
  }

  .project-intro {
    grid-template-columns: 1fr;
    gap: 40px;
    margin: 80px auto 120px;
  }

  .project-title {
    font-size: 58px;
  }

  .gallery-grid {
    column-gap: 24px;
    row-gap: 60px;
  }

  .frame.center {
    width: 75%;
  }

}

/* ---------- MOBILE ---------- */

@media(max-width:600px) {

  :root {
    --pad: 20px;
  }

  nav {
    padding: 22px var(--pad);
  }

  .n-links {
    gap: 17px;
  }

  .n-logo,
  .n-link {
    font-size: 9px;
    letter-spacing: .12em;
  }

  .project-intro {
    gap: 35px;
    margin: 75px auto 85px;
  }

  .story {
    padding: 0 var(--pad) 80px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
    row-gap: 45px;
  }

  .frame.center {
    grid-column: auto;
    width: 100%;
  }

  .frame.pair img {
    aspect-ratio: auto;
  }

  .caption {
    margin-top: 12px;
    font-size: 9px;
    letter-spacing: .12em;
  }

}

</style>
</head>

<body>

<nav>

<a href="https://mayaterzi.com" class="n-logo">Maya Terzi</a>

<div class="n-links">

<a href="https://mayaterzi.com/projects" class="n-link">Projects</a>
<a href="https://mayaterzi.com/maya" class="n-link">About</a>
<a href="https://mayaterzi.com/connect" class="n-link">Connect</a>

</div>

</nav>


<section class="project-intro">

    <div class="project-heading">

        <div class="project-number">07</div>

        <h1 class="project-title">
            <a href="#">
                Morning on<br>the Caspian
            </a>
        </h1>

    </div>

    <div class="project-meta">
        
        Garment Construction<br>
        Creative Direction<br>
        Campaign Development<br>

        <br><br>
        
        Winter 2026
        
        <br><br> 
        
        <a href="https://instagram.com/byterzievi"
           target="_blank"
           rel="noopener noreferrer">
            View Social Channel
        </a>

        <br><br>


    </div>

</section>


<section class="story">

  <div class="gallery-grid">

    <!-- FIRST ROW — TWO IMAGES -->

    <div class="frame pair">
      <img src="image1.png" alt="Morning on the Caspian — Campaign">
      <div class="caption">Final Campaign</div>
    </div>

    <div class="frame pair">
      <img src="image2.png" alt="Morning on the Caspian — Campaign">
      <div class="caption">Final Campaign</div>
    </div>


    <!-- SECOND ROW — CENTERED IMAGE -->

    <div class="frame center">
      <img src="image3.png" alt="Morning on the Caspian — Campaign">
      <div class="caption">Final Campaign</div>
    </div>


    <!-- THIRD ROW — TWO IMAGES -->

    <div class="frame pair">
      <img src="image4.png" alt="Morning on the Caspian — Campaign">
      <div class="caption">Final Campaign</div>
    </div>

    <div class="frame pair">
      <img src="image5.png" alt="Morning on the Caspian — Campaign">
      <div class="caption">Final Campaign</div>
    </div>

  </div>

</section>

</body>
</html>
