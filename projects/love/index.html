
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love; Unity — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #fff;
    --ink: #0e0e0e;
    --accent: #e67d43;
    --pad: 48px;
}

body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
}

/* ---------- NAV ---------- */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px var(--pad);
}

.n-logo {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    transition: .2s;
}

.n-logo:hover {
    color: var(--accent);
}

.n-links {
    display: flex;
    gap: 40px;
}

.n-link {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: .45;
    transition: .2s;
}

.n-link:hover {
    opacity: 1;
    color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
    max-width: 1400px;
    margin: 120px auto 150px;
    padding: 0 var(--pad);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 100px;
    align-items: end;
}

.project-heading {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.project-number {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(0,0,0,.35);
    transition: .3s;
}

.project-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(4rem, 9vw, 8rem);
    font-weight: 400;
    line-height: .9;
    letter-spacing: -.03em;
}

.project-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
    color: var(--accent);
}

.project-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    line-height: 2;
    color: rgba(0,0,0,.55);
}

.project-meta a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,.3);
    transition: color .3s ease, border-color .3s ease;
}

.project-meta a:hover {
    color: var(--accent);
    border-color: var(--accent);
}

/* ---------- IMAGE STORY ---------- */

.story {
    max-width: 1600px;
    margin: auto;
    padding: 0 var(--pad) 180px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 28px;
    row-gap: 100px;
    align-items: start;
}

.frame {
    width: 100%;
    overflow: hidden;
}

.frame img {
    width: 100%;
    display: block;
    transition: transform .7s ease;
}

.frame:hover img {
    transform: scale(1.015);
}

/* Paired campaign images */

.frame.pair img {
    aspect-ratio: 4 / 5;
    object-fit: cover;
}

/* Larger centered image */

.frame.center {
    grid-column: 1 / -1;
    width: 68%;
    justify-self: center;
}

.frame.center img {
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* Captions */

.caption {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.45);
}

/* ---------- CAMPAIGN FILM ---------- */

.film-section {
    width: 82%;
    margin: 140px auto;
}

.film-link {
    display: block;
    text-decoration: none;
    color: inherit;
}

.film-frame {
    position: relative;
    overflow: hidden;
}

.film-frame .play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(5px);
    transition: background .3s ease, transform .3s ease;
    z-index: 2;
}

.film-frame .play-button svg {
    width: 17px;
    height: 17px;
    fill: white;
    margin-left: 3px;
}

.film-link:hover .play-button {
    background: rgba(230,125,67,.9);
    transform: translate(-50%, -50%) scale(1.08);
}

@media(max-width:600px) {
    .film-frame .play-button {
        width: 48px;
        height: 48px;
    }
}

/* ---------- TABLET ---------- */

@media (max-width: 900px) {

    :root {
        --pad: 28px;
    }

    .project-intro {
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 40px;
        margin: 90px auto 120px;
    }

    .project-title {
        font-size: clamp(4rem, 10vw, 6rem);
    }

    .gallery-grid {
        column-gap: 20px;
        row-gap: 75px;
    }

    .film-section {
        width: 90%;
        margin: 100px auto;
    }

    .frame.center {
        width: 78%;
    }
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

    :root {
        --pad: 20px;
    }

    nav {
        padding: 22px var(--pad);
    }

    .n-links {
        gap: 16px;
    }

    .n-logo,
    .n-link {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .project-intro {
        grid-template-columns: 1fr;
        gap: 32px;
        margin: 75px auto 85px;
    }

    .project-title {
        font-size: 64px;
    }

    .project-meta {
        font-size: 10px;
        line-height: 2;
    }

    .story {
        padding: 0 var(--pad) 100px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
        row-gap: 55px;
    }

    .frame.pair img {
        aspect-ratio: auto;
        height: auto;
    }

    .frame.center {
        grid-column: auto;
        width: 100%;
    }

    .film-section {
        width: 100%;
        margin: 75px auto;
    }

    .caption,
    .film-caption {
        font-size: 9px;
        margin-top: 12px;
    }

}

</style>
</head>

<body>

<nav>

    <a href="https://mayaterzi.com" class="n-logo">Maya Terzi</a>

    <div class="n-links">
        <a href="https://mayaterzi.com/projects" class="n-link">Projects</a>
        <a href="https://mayaterzi.com/maya" class="n-link">About</a>

        <!-- CENTERED CAMPAIGN IMAGE -->

        <div class="frame center">
            <img src="image3.png" alt="Love; Unity campaign image 03">

        </div>

    </div>


    <!-- CAMPAIGN FILM -->

<div class="film-frame">
    <img src="preview6.png" alt="Love; Unity Campaign Film">

    <div class="play-button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>
</div>


    <!-- CLOSING IMAGE PAIR -->

    <div class="gallery-grid">

        <div class="frame pair">
            <img src="image4.png" alt="Love; Unity campaign image 04">
            <div class="caption">Final Campaign</div>
        </div>

        <div class="frame pair">

        </div>

    </div>

</section>

</body>
</html>
