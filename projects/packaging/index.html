
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Packaging Design — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #fff;
    --ink: #0e0e0e;
    --accent: #e67d43;
    --pad: 48px;
}

body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
}

/* ---------- NAVIGATION ---------- */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px var(--pad);
}

.n-logo {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    transition: .2s;
}

.n-logo:hover {
    color: var(--accent);
}

.n-links {
    display: flex;
    gap: 40px;
}

.n-link {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: .45;
    transition: .2s;
}

.n-link:hover {
    opacity: 1;
    color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
    max-width: 1200px;
    margin: 120px auto 150px;
    padding: 0 var(--pad);
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 120px;
    align-items: end;
}

.project-heading {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.project-number {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(0,0,0,.35);
    transition: .3s;
}

.project-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(4rem, 9vw, 8rem);
    font-weight: 400;
    line-height: .95;
    letter-spacing: -.03em;
}

.project-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
    color: var(--accent);
}

.project-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    line-height: 2;
    color: rgba(0,0,0,.55);
}

/* ---------- EDITORIAL GALLERY ---------- */

.story {
    max-width: 1600px;
    margin: auto;
    padding: 0 var(--pad) 180px;
}

/* Paired image sections */

.gallery-section {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 40px;
    row-gap: 110px;
    align-items: start;
    margin-bottom: 150px;
}

/* Individual image blocks */

.frame {
    width: 100%;
    min-width: 0;
}

.frame img {
    width: 100%;
    aspect-ratio: 4 / 5;
    height: auto;
    object-fit: cover;
    display: block;
    transition: transform .7s ease, filter .5s ease;
}

.frame:hover img {
    transform: scale(1.015);
    filter: brightness(.9);
}

/* Captions */

.caption {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: .16em;
    line-height: 1.8;
    text-transform: uppercase;
    color: rgba(0,0,0,.45);
    transition: color .3s ease;
}

.frame:hover .caption {
    color: var(--accent);
}

/* ---------- CENTERED FEATURE IMAGE ---------- */

.feature {
    width: 76%;
    margin: 0 auto 150px;
}

.feature img {
    width: 100%;
    aspect-ratio: 4 / 5;
    height: auto;
    object-fit: cover;
    display: block;
    transition: transform .7s ease, filter .5s ease;
}

.feature:hover img {
    transform: scale(1.015);
    filter: brightness(.9);
}

/* ---------- TABLET ---------- */

@media(max-width: 900px) {

    :root {
        --pad: 28px;
    }

    .project-intro {
        grid-template-columns: 1fr 260px;
        gap: 50px;
        margin: 90px auto 110px;
    }

    .project-title {
        font-size: 72px;
    }

    .gallery-section {
        column-gap: 24px;
        row-gap: 75px;
        margin-bottom: 100px;
    }

    .feature {
        width: 88%;
        margin-bottom: 100px;
    }
}

/* ---------- MOBILE ---------- */

@media(max-width: 600px) {

    :root {
        --pad: 20px;
    }

    nav {
        padding: 22px var(--pad);
    }

    .n-links {
        gap: 17px;
    }

    .n-logo,
    .n-link {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .project-intro {
        grid-template-columns: 1fr;
        gap: 35px;
        margin: 75px auto 85px;
    }

    .project-title {
        font-size: 62px;
    }

    .project-meta {
        font-size: 10px;
    }

    .story {
        padding: 0 var(--pad) 80px;
    }

    .gallery-section {
        grid-template-columns: 1fr;
        row-gap: 55px;
        margin-bottom: 75px;
    }

    .feature {
        width: 100%;
        margin-bottom: 75px;
    }

    .caption {
        margin-top: 12px;
        font-size: 9px;
        letter-spacing: .12em;
    }
}

</style>
</head>

<body>

        <a href="https://mayaterzi.com/maya" class="n-link">About</a>

</body>
</html>
