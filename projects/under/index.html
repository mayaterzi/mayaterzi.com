
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Under the Apricot Tree — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #fff;
    --ink: #0e0e0e;
    --accent: #e67d43;
    --pad: 48px;
}

body {
    background: #fff;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
}

/* ---------- NAV ---------- */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px var(--pad);
}

.n-logo {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    transition: .2s;
}

.n-logo:hover {
    color: var(--accent);
}

.n-links {
    display: flex;
    gap: 40px;
}

.n-link {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: .45;
    transition: .2s;
}

.n-link:hover {
    opacity: 1;
    color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
    max-width: 1200px;
    margin: 120px auto 150px;
    padding: 0 var(--pad);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 100px;
    align-items: end;
}

.project-heading {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.project-number {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(0,0,0,.35);
    transition: .3s;
}

.project-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(4rem, 9vw, 8rem);
    font-weight: 400;
    line-height: .95;
    letter-spacing: -.03em;
}

.project-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
    color: var(--accent);
}

.project-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    line-height: 2;
    color: rgba(0,0,0,.55);
}

.project-meta a {
    color: inherit;
    text-decoration: none;
    transition: color .2s ease;
}

.project-meta a:hover {
    color: var(--accent);
}

/* ---------- IMAGE STORY ---------- */

.story {
    max-width: 1600px;
    margin: auto;
    padding: 0 var(--pad) 200px;
}

/* Two-column image layout */

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 28px;
    row-gap: 90px;
    align-items: start;
}

/* Image frames */

.frame {
    width: 100%;
    overflow: hidden;
}

.frame img {
    width: 100%;
    display: block;
    height: auto;
}

/* Paired images */

.frame.pair img {
    aspect-ratio: 4 / 5;
    object-fit: cover;
}

/* Center image break */

.frame.center {
    width: 66%;
    margin: 140px auto;
}

.frame.center img {
    width: 100%;
    height: auto;
}

/* Captions */

.caption {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.45);
}

/* ---------- TABLET ---------- */

@media(max-width:900px) {

    :root {
        --pad: 24px;
    }

    .project-intro {
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 40px;
        margin: 90px auto 120px;
    }

    .project-title {
        font-size: clamp(4rem, 10vw, 6rem);
    }

    .story {
        padding-bottom: 120px;
    }

    .gallery-grid {
        column-gap: 20px;
        row-gap: 65px;
    }

    .frame.center {
        width: 78%;
        margin: 100px auto;
    }
}

/* ---------- MOBILE ---------- */

@media(max-width:600px) {

    :root {
        --pad: 20px;
    }

    nav {
        padding: 22px var(--pad);
    }

    .n-links {
        gap: 16px;
    }

    .n-logo,
    .n-link {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .project-intro {
        grid-template-columns: 1fr;
        gap: 32px;
        margin: 75px auto 85px;
    }

    .project-title {
        font-size: 58px;
    }

    .project-meta {
        font-size: 10px;
        line-height: 2;
    }

    .story {
        padding-bottom: 100px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
        row-gap: 55px;
    }

    .frame.pair img {
        aspect-ratio: auto;
        height: auto;
    }

    .frame.center {
        width: 100%;
        margin: 65px auto;
    }

    .caption {
        font-size: 9px;
        margin-top: 12px;
    }
}

</style>
</head>

<body>

<nav>

    <a href="https://mayaterzi.com" class="n-logo">Maya Terzi</a>

    <div class="n-links">
        <a href="https://mayaterzi.com/projects" class="n-link">Projects</a>
        <a href="https://mayaterzi.com/maya" class="n-link">About</a>
        <a href="https://mayaterzi.com/connect" class="n-link">Connect</a>
    </div>

</nav>


<!-- PROJECT INTRO -->

<section class="project-intro">

    <div class="project-heading">

        <div class="project-number">09</div>

        <h1 class="project-title">
            <a href="#">
                Under the<br>Apricot Tree
            </a>
        </h1>

    </div>

<div class="project-meta">
    Garment Construction<br>
    Creative Direction<br>
    Campaign Development<br>

    <br><br>

    Summer 2025<br>
    <a href="https://instagram.com/byterzievi"
       target="_blank"
       rel="noopener noreferrer">
        View Social Channel
    </a>
</div>

</section>


<!-- IMAGE STORY -->

<section class="story">

    <!-- OPENING: TWO IMAGES -->

    <div class="gallery-grid">

        <div class="frame pair">
            <img src="image1.png" alt="Under the Apricot Tree campaign image 1">
            <div class="caption">Final Campaign</div>
        </div>

        <div class="frame pair">
            <img src="image2.png" alt="Under the Apricot Tree campaign image 2">
            <div class="caption">Final Campaign</div>
        </div>

    </div>


    <!-- CENTER IMAGE BREAK -->

    <div class="frame center">
        <img src="image4.png" alt="Under the Apricot Tree campaign image 4">
        <div class="caption">Final Campaign</div>
    </div>


    <!-- CLOSING: TWO IMAGES -->

    <div class="gallery-grid">

        <div class="frame pair">
            <img src="image3.png" alt="Under the Apricot Tree campaign image 3">
            <div class="caption">Final Campaign</div>
        </div>

        <div class="frame pair">
            <img src="image5.png" alt="Under the Apricot Tree campaign image 5">
            <div class="caption">Final Campaign</div>
        </div>

    </div>

</section>

</body>
</html>
