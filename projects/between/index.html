
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Between Sand and Sea — Maya Terzi</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --white: #fff;
  --ink: #0e0e0e;
  --accent: #e67d43;
  --pad: 48px;
}

body {
  background: var(--white);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
}

/* ---------- NAVIGATION ---------- */

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px var(--pad);
}

.n-logo {
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  transition: .2s;
}

.n-logo:hover {
  color: var(--accent);
}

.n-links {
  display: flex;
  gap: 40px;
}

.n-link {
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  opacity: .45;
  transition: .2s;
}

.n-link:hover {
  opacity: 1;
  color: var(--accent);
}

/* ---------- PROJECT INTRO ---------- */

.project-intro {
  max-width: 1400px;
  margin: 120px auto 180px;
  padding: 0 var(--pad);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 80px;
  align-items: end;
}

.project-heading {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.project-number {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(0,0,0,.35);
  transition: .3s;
}

.project-title {
  font-family: 'EB Garamond', serif;
  font-size: clamp(4rem, 9vw, 8rem);
  font-weight: 400;
  line-height: .95;
  letter-spacing: -.03em;
}

.project-title a {
  color: var(--ink);
  text-decoration: none;
  transition: color .35s ease;
}

.project-heading:hover .project-title a,
.project-heading:hover .project-number {
  color: var(--accent);
}

.project-meta {
  justify-self: end;
  width: 100%;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .18em;
  line-height: 2;
  color: rgba(0,0,0,.55);
  padding-bottom: 8px;
}

.project-meta a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid rgba(0,0,0,.25);
  transition: .3s;
}

.project-meta a:hover {
  color: var(--accent);
  border-color: var(--accent);
}
    
/* ---------- SYMMETRICAL IMAGE GALLERY ---------- */

.story {
  max-width: 1600px;
  margin: auto;
  padding: 0 var(--pad) 180px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 32px;
  row-gap: 90px;
  align-items: start;
}

.frame {
  width: 100%;
  min-width: 0;
  overflow: hidden;
}

.frame img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform .7s ease, filter .5s ease;
}

.frame:hover img {
  transform: scale(1.015);
  filter: brightness(.95);
}

/* Full-width images */

.frame.wide {
  grid-column: 1 / -1;
}

/* Matching portrait images */

.frame.pair img {
  aspect-ratio: 4 / 5;
  object-fit: cover;
}

/* IMAGE CAPTIONS */

.caption {
  margin-top: 18px;
  font-size: 10px;
  letter-spacing: .16em;
  line-height: 1.8;
  text-transform: uppercase;
  color: rgba(0,0,0,.45);
  transition: color .3s ease;
}

.frame:hover .caption {
  color: var(--accent);
}

/* ---------- TABLET ---------- */

@media(max-width: 900px) {
  .project-intro {
    grid-template-columns: 1fr 260px;
    gap: 35px;
    margin: 80px auto 120px;
  }

  .project-title {
    font-size: 68px;
  }
}

@media(max-width: 600px) {
  .project-intro {
    grid-template-columns: 1fr;
    gap: 35px;
    margin: 75px auto 85px;
  }
}
    
/* ---------- MOBILE ---------- */

@media(max-width: 600px) {

  :root {
    --pad: 20px;
  }

  nav {
    padding: 22px var(--pad);
  }

  .n-links {
    gap: 17px;
  }

  .n-logo,
  .n-link {
    font-size: 9px;
    letter-spacing: .12em;
  }

  .project-intro {
    gap: 35px;
    margin: 75px auto 85px;
  }

  .project-title {
    font-size: 58px;
  }

  .project-meta {
    font-size: 10px;
  }

  .story {
    padding: 0 var(--pad) 80px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
    row-gap: 45px;
  }

  .frame.wide {
    grid-column: auto;
  }

  .frame.pair img {
    aspect-ratio: auto;
  }

  .caption {
    margin-top: 12px;
    font-size: 9px;
    letter-spacing: .12em;
  }

}

</style>
</head>

<body>

           alt="Between Sand and Sea — campaign editorial">

    </div>


    <!-- IMAGE 04 — FULL WIDTH CLOSING IMAGE -->

</body>
</html>
